<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" font-family="'Consolas','Courier New',monospace">
  <defs>
    <pattern id="grid-minor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2a5a92" stroke-width="0.5"/>
    </pattern>
    <pattern id="grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grid-minor)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#3d72ab" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cfe8ff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="980" fill="#0b2a4a"/>
  <rect x="0" y="0" width="1400" height="980" fill="url(#grid-major)"/>
  <rect x="20" y="20" width="1360" height="940" fill="none" stroke="#cfe8ff" stroke-width="2"/>
  <rect x="30" y="30" width="1340" height="920" fill="none" stroke="#cfe8ff" stroke-width="0.75"/>

  <g stroke="#cfe8ff" stroke-width="1.5">
    <line x1="10" y1="35" x2="30" y2="35"/><line x1="20" y1="25" x2="20" y2="45"/>
    <line x1="1370" y1="35" x2="1390" y2="35"/><line x1="1380" y1="25" x2="1380" y2="45"/>
    <line x1="10" y1="945" x2="30" y2="945"/><line x1="20" y1="935" x2="20" y2="955"/>
    <line x1="1370" y1="945" x2="1390" y2="945"/><line x1="1380" y1="935" x2="1380" y2="955"/>
  </g>

  <text x="60" y="70" fill="#cfe8ff" font-size="26" letter-spacing="3">CHOCOLATE PI — HARDWARE SIGNAL FLOW</text>
  <text x="60" y="94" fill="#7fb3e0" font-size="14" letter-spacing="2">SCHEMATIC, TRACED FROM REFERENCE PHOTOS · NOT TO SCALE</text>

  <!-- ============ RASPBERRY PI 2 MODEL B (left-center hub of the layout) ============ -->
  <g stroke="#cfe8ff" stroke-width="2" fill="none">
    <rect x="100" y="300" width="280" height="190" rx="4"/>
    <!-- GPIO header, top-left -->
    <rect x="125" y="300" width="110" height="14"/>
    <g stroke-width="1">
      <line x1="130" y1="300" x2="130" y2="314"/><line x1="136" y1="300" x2="136" y2="314"/>
      <line x1="142" y1="300" x2="142" y2="314"/><line x1="148" y1="300" x2="148" y2="314"/>
      <line x1="154" y1="300" x2="154" y2="314"/><line x1="160" y1="300" x2="160" y2="314"/>
      <line x1="166" y1="300" x2="166" y2="314"/><line x1="172" y1="300" x2="172" y2="314"/>
      <line x1="178" y1="300" x2="178" y2="314"/><line x1="184" y1="300" x2="184" y2="314"/>
      <line x1="190" y1="300" x2="190" y2="314"/><line x1="196" y1="300" x2="196" y2="314"/>
      <line x1="202" y1="300" x2="202" y2="314"/><line x1="208" y1="300" x2="208" y2="314"/>
      <line x1="214" y1="300" x2="214" y2="314"/><line x1="220" y1="300" x2="220" y2="314"/>
    </g>
    <!-- SoC + raspberry mark -->
    <rect x="205" y="365" width="72" height="72"/>
    <circle cx="155" cy="380" r="7"/>
    <circle cx="145" cy="395" r="7"/>
    <circle cx="165" cy="395" r="7"/>
    <!-- USB x4, right edge (stacked, matching the real board) -->
    <rect x="368" y="328" width="30" height="24"/>
    <rect x="368" y="358" width="30" height="24"/>
    <rect x="368" y="388" width="30" height="24"/>
    <rect x="368" y="418" width="30" height="24"/>
    <!-- ethernet, right edge below USB -->
    <rect x="366" y="452" width="34" height="26"/>
    <!-- HDMI, micro-USB power, AV jack: bottom edge -->
    <rect x="130" y="486" width="46" height="14"/>
    <circle cx="212" cy="493" r="8"/>
    <rect x="240" y="486" width="20" height="12"/>
    <!-- mounting holes -->
    <circle cx="118" cy="315" r="5"/><circle cx="362" cy="315" r="5"/>
    <circle cx="118" cy="475" r="5"/><circle cx="362" cy="475" r="5"/>
  </g>
  <text x="159" y="310" fill="#cfe8ff" font-size="9" stroke="none">GPIO</text>
  <text x="241" y="405" fill="#cfe8ff" font-size="10" text-anchor="middle" stroke="none">BCM2836</text>
  <text x="212" y="516" fill="#7fb3e0" font-size="10" text-anchor="middle" stroke="none">HDMI</text>
  <text x="250" y="512" fill="#7fb3e0" font-size="9" text-anchor="middle" stroke="none">PWR</text>
  <text x="240" y="282" fill="#cfe8ff" font-size="16" text-anchor="middle" letter-spacing="1">RASPBERRY PI 2 MODEL B</text>
  <text x="406" y="345" fill="#7fb3e0" font-size="10">USB ×4</text>
  <text x="406" y="469" fill="#7fb3e0" font-size="10">ETH</text>

  <!-- ============ HDMI DISPLAY / TV (directly below the Pi, shortest path) ============ -->
  <g stroke="#cfe8ff" stroke-width="2" fill="none">
    <rect x="100" y="560" width="250" height="150" rx="4"/>
    <rect x="165" y="710" width="110" height="10"/>
    <line x1="220" y1="720" x2="220" y2="738"/>
    <line x1="172" y1="738" x2="268" y2="738"/>
  </g>
  <polygon points="198,615 198,655 238,635" fill="#cfe8ff" stroke="none"/>
  <text x="225" y="765" fill="#cfe8ff" font-size="15" text-anchor="middle" letter-spacing="1">HDMI DISPLAY / TV</text>
  <text x="225" y="783" fill="#7fb3e0" font-size="11" text-anchor="middle">mpv --gpu-context=drm</text>

  <!-- ============ M-VAVE CHOCOLATE / PD41 (top-right, matches the Pi's top USB port) ============ -->
  <g stroke="#cfe8ff" stroke-width="2" fill="none">
    <rect x="780" y="140" width="270" height="100" rx="14"/>
    <rect x="802" y="156" width="68" height="26" rx="3"/>
    <circle cx="906" cy="202" r="26"/>
    <circle cx="950" cy="202" r="26"/>
    <circle cx="994" cy="202" r="26"/>
    <circle cx="862" cy="202" r="26"/>
    <rect x="768" y="182" width="12" height="16" rx="2"/>
  </g>
  <text x="836" y="173" fill="#cfe8ff" font-size="14" text-anchor="middle" stroke="none">1A</text>
  <text x="862" y="208" fill="#cfe8ff" font-size="12" text-anchor="middle" stroke="none">A</text>
  <text x="906" y="208" fill="#cfe8ff" font-size="12" text-anchor="middle" stroke="none">B</text>
  <text x="950" y="208" fill="#cfe8ff" font-size="12" text-anchor="middle" stroke="none">C</text>
  <text x="994" y="208" fill="#cfe8ff" font-size="12" text-anchor="middle" stroke="none">D</text>
  <text x="915" y="270" fill="#cfe8ff" font-size="15" text-anchor="middle" letter-spacing="1">M-VAVE CHOCOLATE (PD41)</text>
  <text x="915" y="288" fill="#7fb3e0" font-size="11" text-anchor="middle">USB/BLE WIRELESS MIDI FOOT CONTROLLER</text>

  <!-- ============ LIBRARY USB DRIVE (middle-right, matches the Pi's 2nd USB port) ============ -->
  <g stroke="#cfe8ff" stroke-width="2" fill="none">
    <rect x="800" y="312" width="80" height="34" rx="3"/>
    <rect x="812" y="290" width="28" height="22"/>
  </g>
  <text x="840" y="372" fill="#cfe8ff" font-size="15" text-anchor="middle" letter-spacing="1">LIBRARY USB DRIVE</text>
  <text x="840" y="390" fill="#7fb3e0" font-size="11" text-anchor="middle">NTFS · SETLIST FOLDERS · READ-ONLY MOUNT</text>

  <!-- ============ BEHRINGER U-PHORIA UM2 (bottom-right, matches the Pi's 3rd USB port) ============ -->
  <g stroke="#cfe8ff" stroke-width="2" fill="none">
    <path d="M780,490 L780,600 L1060,600 L1060,450 L860,430 Z"/>
    <!-- 3 knobs on the angled top face -->
    <circle cx="835" cy="465" r="17"/>
    <circle cx="890" cy="458" r="17"/>
    <circle cx="945" cy="453" r="15"/>
    <line x1="835" y1="465" x2="835" y2="451"/>
    <line x1="890" y1="458" x2="890" y2="444"/>
    <line x1="945" y1="453" x2="950" y2="440"/>
    <!-- front face: combo XLR, inst jack, LEDs, headphone -->
    <circle cx="825" cy="550" r="24"/>
    <circle cx="900" cy="560" r="14"/>
    <circle cx="1025" cy="540" r="15"/>
    <circle cx="950" cy="535" r="4"/><circle cx="950" cy="548" r="4"/>
    <circle cx="975" cy="538" r="4"/><circle cx="975" cy="551" r="4"/>
  </g>
  <text x="920" y="440" fill="#cfe8ff" font-size="10" text-anchor="middle" stroke="none">behringer</text>
  <text x="900" y="585" fill="#cfe8ff" font-size="11" text-anchor="middle" stroke="none">U-PHORIA UM2</text>
  <text x="920" y="625" fill="#cfe8ff" font-size="15" text-anchor="middle" letter-spacing="1">BEHRINGER U-PHORIA UM2</text>
  <text x="920" y="643" fill="#7fb3e0" font-size="11" text-anchor="middle">USB AUDIO I/F · BALANCED OUT → PA / MIXER</text>

  <!-- ============ CONNECTIONS ============ -->
  <!-- All three USB peripherals plug directly into the Pi's own USB ports,
       no external hub. The "USB hub" mentioned in TESTING.md's undervoltage
       investigation is the Pi 2's own internal onboard hub controller (how
       dmesg reports its USB topology), not a separate physical device.
       Peripherals are stacked in the same top-to-bottom order as the Pi's
       USB ports they connect to, so none of the four cables cross. -->
  <g stroke="#cfe8ff" stroke-width="1.75" stroke-dasharray="6 5" fill="none" marker-end="url(#arrow)">
    <path d="M212,501 C215,540 220,600 220,613"/>
    <path d="M768,186 C600,178 470,250 398,340"/>
    <path d="M812,318 C650,335 490,352 398,370"/>
    <path d="M780,545 C610,480 480,430 398,400"/>
  </g>
  <text x="240" y="590" fill="#cfe8ff" font-size="12">HDMI</text>
  <text x="480" y="270" fill="#cfe8ff" font-size="12" text-anchor="middle">USB MIDI</text>
  <text x="560" y="400" fill="#cfe8ff" font-size="12" text-anchor="middle">USB (ro)</text>
  <text x="560" y="470" fill="#cfe8ff" font-size="12" text-anchor="middle">USB AUDIO</text>

  <!-- ============ LEGEND ============ -->
  <g stroke="#cfe8ff" stroke-width="1" fill="none">
    <rect x="1000" y="850" width="330" height="100"/>
  </g>
  <text x="1012" y="868" fill="#cfe8ff" font-size="12" letter-spacing="1">LEGEND</text>
  <line x1="1012" y1="882" x2="1052" y2="882" stroke="#cfe8ff" stroke-width="1.75" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="1060" y="886" fill="#7fb3e0" font-size="11">direction data actually flows</text>
  <text x="1012" y="906" fill="#7fb3e0" font-size="11">→ into the Pi: MIDI in, library read</text>
  <text x="1012" y="924" fill="#7fb3e0" font-size="11">→ out of the Pi: audio out, video out</text>
  <text x="1012" y="942" fill="#7fb3e0" font-size="11">solid outlines: traced from real reference photos</text>

  <!-- ============ TITLE BLOCK ============ -->
  <g stroke="#cfe8ff" stroke-width="1" fill="none">
    <rect x="70" y="850" width="460" height="100"/>
    <line x1="70" y1="875" x2="530" y2="875"/>
    <line x1="70" y1="900" x2="530" y2="900"/>
    <line x1="70" y1="925" x2="530" y2="925"/>
    <line x1="310" y1="875" x2="310" y2="950"/>
  </g>
  <text x="82" y="868" fill="#cfe8ff" font-size="13" letter-spacing="1">PROJECT: CHOCOLATE PI</text>
  <text x="82" y="893" fill="#7fb3e0" font-size="12">DWG: hardware-blueprint.svg</text>
  <text x="320" y="893" fill="#7fb3e0" font-size="12">REV: 4.0</text>
  <text x="82" y="918" fill="#7fb3e0" font-size="12">LICENSE: MIT</text>
  <text x="320" y="918" fill="#7fb3e0" font-size="12">DATE: 2026-09-05</text>
  <text x="82" y="943" fill="#7fb3e0" font-size="12">github.com/hesner/chocolate-pi</text>
</svg>
